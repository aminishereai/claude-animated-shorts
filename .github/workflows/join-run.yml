# Re-joins the chunks of an earlier render run and commits the video to
# a pre-release (render-<run id>) (for when the render run's own join step failed).
name: join-run
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "render run id", required: true }
      out_size: { default: "1080x1920" }
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/join-run.yml"]
permissions:
  actions: read
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: chunks
          run-id: ${{ inputs.run_id || '45663722522' }}
          github-token: ${{ github.token }}
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Join, upscale, publish as pre-release
        run: |
          ls chunks/*.mp4 | sort | sed "s/^/file '/; s/$/'/" > list.txt
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy joined.mp4
          W=${OUT%x*}; H=${OUT#*x}
          mkdir -p renders
          ffmpeg -v error -i joined.mp4 -vf "scale=$W:$H:flags=lanczos" -c:v libx264 -crf 18 -preset slow -pix_fmt yuv420p "renders/run-$RUN.mp4"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "renders/run-$RUN.mp4"
          gh release create "render-$RUN" "renders/run-$RUN.mp4" --prerelease --target "$GITHUB_SHA" \
            --title "Render from run $RUN" --notes "Joined and upscaled chunks of render run $RUN."
        env:
          OUT: ${{ inputs.out_size || '1080x1920' }}
          RUN: ${{ inputs.run_id || '45663722522' }}
          GH_TOKEN: ${{ github.token }}
