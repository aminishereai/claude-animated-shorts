# Re-joins the chunks of an earlier render run and commits the video to
# renders/ on this branch (for when the render run's own join step failed).
name: join-run
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "render run id", required: true }
      out_size: { default: "1080x1920" }
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/join-run.yml"]
permissions:
  actions: read
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: chunks
          run-id: ${{ inputs.run_id || '45663722522' }}
          github-token: ${{ github.token }}
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Join, upscale, commit
        env:
          OUT: ${{ inputs.out_size || '1080x1920' }}
          RUN: ${{ inputs.run_id || '45663722522' }}
        run: |
          ls chunks/*.mp4 | sort | sed "s/^/file '/; s/$/'/" > list.txt
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy joined.mp4
          W=${OUT%x*}; H=${OUT#*x}
          mkdir -p renders
          ffmpeg -v error -i joined.mp4 -vf "scale=$W:$H:flags=lanczos" -c:v libx264 -crf 18 -preset slow -pix_fmt yuv420p "renders/run-$RUN.mp4"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "renders/run-$RUN.mp4"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add renders && git commit -m "renders: joined video from run $RUN [skip ci]" && git push
